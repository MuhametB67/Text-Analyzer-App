services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./frontend
    ports:
      - "8000:80"
    depends_on:
      - api
    restart: unless-stopped
